version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TGBOT_API_KEY=${TGBOT_API_KEY}
      - DEV_ACCESS_KEY=${DEV_ACCESS_KEY}
      - MONGODB_URI=mongodb://mongodb:27017/sorhy
    depends_on:
      - mongodb
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - sorhy-network

  mongodb:
    image: mongo:6
    environment:
      - MONGO_INITDB_DATABASE=sorhy
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped
    networks:
      - sorhy-network

volumes:
  mongodb_data:
    driver: local

networks:
  sorhy-network:
    driver: bridge
